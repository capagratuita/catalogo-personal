<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Catálogo</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        .admin-panel {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e0e0e0;
        }

        .admin-header h2 {
            color: var(--primary);
            margin: 0;
        }

        .btn-logout {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-logout:hover {
            background: #b71c1c;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .categorias-editor {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .categorias-tabs {
            display: flex;
            gap: 0.25rem;
            border-bottom: 1px solid #e5dcd5;
        }

        .categorias-tab {
            margin-bottom: -1px;
            padding: 0.5rem 0.9rem;
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #8a7466;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .categorias-tab:hover {
            color: var(--primary);
        }

        .categorias-tab.activa {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .categorias-panel {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .categorias-ayuda {
            margin: 0;
            font-size: 0.8rem;
            color: #8a7466;
        }

        .categorias-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .categoria-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.6rem 0.35rem 0.8rem;
            background: #f3e9e1;
            color: var(--primary);
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .categoria-chip button {
            border: none;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 0;
        }

        .categoria-chip button:hover {
            color: #d32f2f;
        }

        .categorias-add {
            display: flex;
            gap: 0.5rem;
        }

        .categorias-add input {
            flex: 1;
        }

        .btn-add-categoria {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 0 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .btn-add-categoria:hover {
            background: #45a049;
        }

        .categorias-agendamiento {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.75rem;
            background: #fbf7f3;
            border: 1px dashed #d8c3b4;
            border-radius: 8px;
        }

        .categorias-agendamiento-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .categorias-agendamiento-titulo {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #6b4a35;
        }

        .categorias-agendamiento-ayuda {
            font-size: 0.8rem;
            color: #8a7466;
            line-height: 1.35;
        }

        .categorias-agendamiento-opciones {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .categorias-agendamiento-opciones label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0;
            padding: 0.35rem 0.65rem;
            background: #ffffff;
            border: 1px solid #ddd0c6;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.2;
            color: #5a463a;
            cursor: pointer;
            user-select: none;
        }

        .categorias-agendamiento-opciones label:hover {
            border-color: var(--primary);
        }

        .categorias-agendamiento-opciones label.activa {
            background: #f3e9e1;
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .categorias-agendamiento-opciones input[type="checkbox"] {
            flex: 0 0 auto;
            width: 1rem;
            height: 1rem;
            min-height: 0;
            margin: 0;
            padding: 0;
            accent-color: var(--primary);
        }

        .categorias-agendamiento-opciones .sin-categorias {
            font-size: 0.85rem;
            color: #999;
        }

        .items-container {
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-height: 600px;
            overflow-y: auto;
        }

        .item-row {
            display: grid;
            grid-template-columns: 100px 150px 1fr 120px 80px auto;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-row.header {
            background: #f5f5f5;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        .item-row input,
        .item-row select {
            padding: 0.5rem;
            font-size: 0.9rem;
        }

        .item-row-edit {
            display: block;
            margin: 0.75rem;
            border: 1px solid #e2d3c5;
            border-radius: 8px;
            background: #fffdfb;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .item-row-edit:nth-child(even) {
            background: #faf6f2;
        }

        .item-fila {
            display: grid;
            gap: 0.75rem;
        }

        .item-fila + .item-fila {
            margin-top: 0.75rem;
        }

        .item-fila-principal {
            grid-template-columns: 110px 140px minmax(160px, 1fr) 110px auto;
            align-items: center;
        }

        .item-fila-secundaria {
            grid-template-columns: minmax(150px, 1fr) auto auto 110px minmax(180px, 1.4fr);
            align-items: center;
        }

        .item-row-edit .item-desc {
            width: 100%;
            min-height: 60px;
            padding: 0.5rem;
            font-size: 0.9rem;
            font-family: inherit;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
        }

        .item-row-edit label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: #555;
            white-space: nowrap;
        }

        .item-row-edit label input {
            width: auto;
        }

        .item-row-edit input,
        .item-row-edit select {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .item-row-edit .btn-remove-item {
            justify-self: end;
        }

        @media (max-width: 768px) {
            .item-fila-principal,
            .item-fila-secundaria {
                grid-template-columns: 1fr;
            }

            .item-row-edit .btn-remove-item {
                justify-self: start;
            }
        }

        .btn-add-item {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .btn-add-item:hover {
            background: #45a049;
        }

        .btn-remove-item {
            background: #f44336;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 5px;
            cursor: pointer;
            width: 30px;
            height: 30px;
        }

        .btn-remove-item:hover {
            background: #d32f2f;
        }

        .categoria-section {
            margin-bottom: 2rem;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .categoria-section h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .preview-section {
            margin-top: 2rem;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .preview-section h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .preview-content {
            padding: 1rem;
            background: white;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
            margin-right: 1rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #757575;
        }

        .btn-secondary:hover {
            background: #616161;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            background: #ffebee;
            color: #d32f2f;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1rem;
        }

        .success {
            background: #e8f5e8;
            color: #388e3c;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1rem;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo">Panel de Administración</div>
        </div>
    </nav>

    <main>
        <div class="admin-panel">
            <div class="admin-header">
                <h2>Gestión del Catálogo</h2>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>

            <div id="mensaje-error" class="oculto"></div>
            <div id="mensaje-exito" class="oculto"></div>

            <form id="form-catalogo">
                <div class="form-group">
                    <label>Categorías</label>
                    <div class="categorias-editor">
                        <div class="categorias-tabs" role="tablist" aria-label="Tipo de categoría">
                            <button type="button" class="categorias-tab activa" data-tipo="producto" role="tab" aria-selected="true" aria-controls="panel-categorias-producto" onclick="cambiarTabCategorias('producto')">Productos</button>
                            <button type="button" class="categorias-tab" data-tipo="servicio" role="tab" aria-selected="false" aria-controls="panel-categorias-servicio" onclick="cambiarTabCategorias('servicio')">Servicios</button>
                        </div>

                        <div class="categorias-panel" id="panel-categorias-producto" data-tipo="producto" role="tabpanel">
                            <div class="categorias-chips" id="categorias-chips-producto"></div>
                            <div class="categorias-add">
                                <input type="text" class="categoria-input" id="catalogo-categoria-input-producto" data-tipo="producto" placeholder="Nueva categoría de producto">
                                <button type="button" class="btn-add-categoria" onclick="agregarCategoria('producto')">+</button>
                            </div>
                            <p class="categorias-ayuda">Solo se asignan a productos.</p>
                        </div>

                        <div class="categorias-panel oculto" id="panel-categorias-servicio" data-tipo="servicio" role="tabpanel">
                            <div class="categorias-chips" id="categorias-chips-servicio"></div>
                            <div class="categorias-add">
                                <input type="text" class="categoria-input" id="catalogo-categoria-input-servicio" data-tipo="servicio" placeholder="Nueva categoría de servicio">
                                <button type="button" class="btn-add-categoria" onclick="agregarCategoria('servicio')">+</button>
                            </div>
                            <p class="categorias-ayuda">Solo se asignan a servicios.</p>
                            <div class="categorias-agendamiento">
                                <div class="categorias-agendamiento-info">
                                    <span class="categorias-agendamiento-titulo">Agendamiento con Calendly</span>
                                    <span class="categorias-agendamiento-ayuda">Marca las categorías de servicios que se reservan con Calendly. El resto va al carrito.</span>
                                </div>
                                <div class="categorias-agendamiento-opciones" id="categorias-agendamiento"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="items-container">
                    <!-- Items serán agregados aquí -->
                </div>

                <button type="button" class="btn-add-item" onclick="agregarItem()">+ Agregar Item</button>

                <div class="form-group">
                    <label>Validación del Catálogo</label>
                    <div class="items-container" id="items-preview">
                        <div class="item-row header">
                            <span>ID</span>
                            <span>Tipo</span>
                            <span>Nombre</span>
                            <span>Categoría</span>
                            <span>Precio</span>
                            <span>Acciones</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn">Guardar Catálogo</button>
                <button type="button" class="btn btn-secondary" onclick="previsualizarCatalogo()">Previsualizar JSON</button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Guardando...</p>
                </div>
            </form>

            <div class="preview-section" id="preview-section" style="display: none;">
                <h3>Vista Previa del JSON</h3>
                <div id="preview-content" class="preview-content"></div>
            </div>
        </div>
    </main>

    <script src="../assets/admin.js"></script>
    <script>
        let catalogoActual = null;
        let itemIdCounter = 1;
        let categoriasPorTipo = { producto: [], servicio: [] };
        let categoriasAgendamiento = [];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, caracter => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[caracter]));
        }

        function obtenerCatalogo() {
            const categorias = {
                producto: [...categoriasPorTipo.producto],
                servicio: [...categoriasPorTipo.servicio]
            };

            const items = [];
            const itemRows = document.querySelectorAll('#items-container .item-row');

            itemRows.forEach(row => {
                const item = {
                    id: row.querySelector('.item-id').value,
                    tipo: row.querySelector('.item-tipo').value,
                    nombre: row.querySelector('.item-nombre').value,
                    descripcion: row.querySelector('.item-desc').value,
                    precio: parseFloat(row.querySelector('.item-precio').value) || 0,
                    categoria: row.querySelector('.item-categoria').value,
                    disponible: row.querySelector('.item-disponible input').checked,
                    destacado: row.querySelector('.item-destacado input').checked,
                    calendly_url: row.querySelector('.item-calendly').value || null
                };

                item.duracion_minutos = item.tipo === 'servicio'
                    ? parseInt(row.querySelector('.item-duracion').value) || 0
                    : null;

                items.push(item);
            });

            return {
                categorias: categorias,
                categorias_agendamiento: [...new Set(
                    categoriasAgendamiento.filter(categoria => categoriasPorTipo.servicio.includes(categoria))
                )],
                items: items
            };
        }

        function agregarItem() {
            const itemsContainer = document.getElementById('items-container');
            const nuevoItem = document.createElement('div');
            nuevoItem.className = 'item-row item-row-edit';
            nuevoItem.innerHTML = `
                <div class="item-fila item-fila-principal">
                    <input class="item-id" type="text" placeholder="id-unico" required>
                    <select class="item-tipo" required>
                        <option value="">Seleccionar...</option>
                        <option value="producto">Producto</option>
                        <option value="servicio">Servicio</option>
                    </select>
                    <input class="item-nombre" type="text" placeholder="Nombre del item" required>
                    <input class="item-precio" type="number" placeholder="Precio" step="0.01" required>
                    <button type="button" class="btn-remove-item" onclick="eliminarItem(this)">×</button>
                </div>
                <div class="item-fila">
                    <textarea class="item-desc" placeholder="Descripción (máx. 200 caracteres)" maxlength="200" required></textarea>
                </div>
                <div class="item-fila item-fila-secundaria">
                    <select class="categoria-select item-categoria">
                        <option value="">Seleccionar categoría (opcional)</option>
                    </select>
                    <label class="item-disponible"><input type="checkbox" checked> Disponible</label>
                    <label class="item-destacado"><input type="checkbox"> Destacado</label>
                    <input class="item-duracion" type="number" placeholder="Minutos" value="0">
                    <input class="item-calendly" type="text" placeholder="URL de Calendly (opcional)">
                </div>
            `;

            itemsContainer.appendChild(nuevoItem);

            // Actualizar las opciones de categoría con las existentes
            actualizarOpcionesCategoria();

            // Generar ID automático si está vacío
            const idInput = nuevoItem.querySelector('.item-id');
            if (!idInput.value) {
                idInput.value = `item-${itemIdCounter++}`;
            }
        }

        function eliminarItem(button) {
            const row = button.closest('.item-row');
            row.remove();
            renderizarOpcionesAgendamiento();
        }

        function actualizarOpcionesCategoria() {
            document.querySelectorAll('#items-container .item-row').forEach(row => {
                const tipo = row.querySelector('.item-tipo')?.value;
                const select = row.querySelector('.categoria-select');
                if (!select) return;

                const seleccionActual = select.value;
                const categorias = tipo === 'producto' || tipo === 'servicio'
                    ? categoriasPorTipo[tipo]
                    : [];

                // Limpiar opciones existentes (excepto la primera)
                while (select.options.length > 1) {
                    select.remove(1);
                }

                // Agregar solo las categorías del tipo del item
                categorias.forEach(categoria => {
                    const option = document.createElement('option');
                    option.value = categoria;
                    option.textContent = categoria;
                    select.appendChild(option);
                });

                // Mantener la selección previa si la categoría sigue existiendo
                select.value = categorias.includes(seleccionActual) ? seleccionActual : '';
            });
        }

        function actualizarPreviewItems() {
            const catalogo = obtenerCatalogo();
            const previewContainer = document.getElementById('items-preview');

            if (!catalogo.items || catalogo.items.length === 0) {
                previewContainer.innerHTML = '<p>No hay items para mostrar</p>';
                return;
            }

            let html = '<div class="item-row header">';
            html += '<span>ID</span><span>Tipo</span><span>Nombre</span><span>Categoría</span><span>Precio</span><span>Acciones</span>';
            html += '</div>';

            catalogo.items.forEach(item => {
                html += `<div class="item-row">`;
                html += `<span>${item.id}</span>`;
                html += `<span>${item.tipo}</span>`;
                html += `<span>${item.nombre}</span>`;
                html += `<span>${item.categoria}</span>`;
                html += `<span>S/. ${item.precio}</span>`;
                html += `<span>✓ ${item.disponible} | ${item.destacado ? '⭐' : ''}</span>`;
                if (item.tipo === 'servicio') {
                    html += `<span>${item.duracion_minutos} min</span>`;
                }
                html += `</div>`;
            });

            previewContainer.innerHTML = html;
        }

        function renderizarCategorias() {
            ['producto', 'servicio'].forEach(tipo => {
                const chips = document.getElementById(`categorias-chips-${tipo}`);
                chips.innerHTML = '';

                categoriasPorTipo[tipo].forEach((categoria, index) => {
                    const chip = document.createElement('span');
                    chip.className = 'categoria-chip';
                    chip.textContent = categoria;

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = '×';
                    btn.setAttribute('aria-label', `Eliminar categoría ${categoria}`);
                    btn.addEventListener('click', () => eliminarCategoria(tipo, index));
                    chip.appendChild(btn);

                    chips.appendChild(chip);
                });
            });

            renderizarOpcionesAgendamiento();
            actualizarOpcionesCategoria();
        }

        function cambiarTabCategorias(tipo) {
            document.querySelectorAll('.categorias-tab').forEach(tab => {
                const activa = tab.dataset.tipo === tipo;
                tab.classList.toggle('activa', activa);
                tab.setAttribute('aria-selected', activa ? 'true' : 'false');
            });

            document.querySelectorAll('.categorias-panel').forEach(panel => {
                panel.classList.toggle('oculto', panel.dataset.tipo !== tipo);
            });
        }

        function renderizarOpcionesAgendamiento() {
            const contenedor = document.getElementById('categorias-agendamiento');
            contenedor.innerHTML = '';

            const opciones = categoriasPorTipo.servicio;

            if (opciones.length === 0) {
                const mensaje = document.createElement('span');
                mensaje.className = 'sin-categorias';
                mensaje.textContent = 'Aún no hay categorías de servicio';
                contenedor.appendChild(mensaje);
                return;
            }

            opciones.forEach(categoria => {
                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = categoriasAgendamiento.includes(categoria);
                label.classList.toggle('activa', checkbox.checked);
                checkbox.addEventListener('change', () => {
                    label.classList.toggle('activa', checkbox.checked);
                    if (checkbox.checked) {
                        if (!categoriasAgendamiento.includes(categoria)) {
                            categoriasAgendamiento.push(categoria);
                        }
                    } else {
                        categoriasAgendamiento = categoriasAgendamiento.filter(c => c !== categoria);
                    }
                });

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(categoria));
                contenedor.appendChild(label);
            });
        }

        function agregarCategoria(tipo) {
            const input = document.getElementById(`catalogo-categoria-input-${tipo}`);
            if (!input) return;

            const nuevas = input.value.split(',').map(c => c.trim()).filter(c => c);
            if (nuevas.length === 0) return;

            nuevas.forEach(categoria => {
                const existe = categoriasPorTipo[tipo].some(c => c.toLowerCase() === categoria.toLowerCase());
                if (!existe) categoriasPorTipo[tipo].push(categoria);
            });

            input.value = '';
            renderizarCategorias();
        }

        function eliminarCategoria(tipo, index) {
            const categoria = categoriasPorTipo[tipo][index];
            categoriasPorTipo[tipo].splice(index, 1);

            if (tipo === 'servicio') {
                categoriasAgendamiento = categoriasAgendamiento.filter(c => c !== categoria);
            }

            renderizarCategorias();
        }

        function normalizarCategorias(catalogo) {
            if (catalogo.categorias && !Array.isArray(catalogo.categorias) && typeof catalogo.categorias === 'object') {
                return {
                    producto: Array.isArray(catalogo.categorias.producto) ? [...catalogo.categorias.producto] : [],
                    servicio: Array.isArray(catalogo.categorias.servicio) ? [...catalogo.categorias.servicio] : []
                };
            }

            const producto = new Set();
            const servicio = new Set();
            const items = Array.isArray(catalogo.items) ? catalogo.items : [];

            items.forEach(item => {
                if (!item.categoria) return;
                if (item.tipo === 'producto') producto.add(item.categoria);
                if (item.tipo === 'servicio') servicio.add(item.categoria);
            });

            if (Array.isArray(catalogo.categorias)) {
                const usadas = new Set([...producto, ...servicio]);
                catalogo.categorias.forEach(categoria => {
                    if (usadas.has(categoria)) return;
                    if (/servicio|cita|taller|consult/i.test(categoria)) {
                        servicio.add(categoria);
                    } else {
                        producto.add(categoria);
                    }
                });
            }

            return { producto: [...producto], servicio: [...servicio] };
        }

        async function cargarCatalogo() {
            try {
                const catalogo = await window.admin.getContent('catalogo');
                catalogoActual = catalogo;
                categoriasPorTipo = normalizarCategorias(catalogo);

                const servicios = new Set(categoriasPorTipo.servicio);
                categoriasAgendamiento = Array.isArray(catalogo.categorias_agendamiento)
                    ? catalogo.categorias_agendamiento.filter(c => servicios.has(c))
                    : categoriasPorTipo.servicio.filter(c => /^citas?$/i.test(c));

                if (catalogo && catalogo.items && catalogo.items.length > 0) {
                    // Limpiar container de items
                    const itemsContainer = document.getElementById('items-container');
                    itemsContainer.innerHTML = '';

                    // Agregar items existentes
                    catalogo.items.forEach(item => {
                        agregarItemConDatos(item);
                        const match = /^item-(\d+)$/.exec(item.id || '');
                        if (match) {
                            itemIdCounter = Math.max(itemIdCounter, parseInt(match[1], 10) + 1);
                        }
                    });
                }

                renderizarCategorias();
                actualizarPreviewItems();
            } catch (error) {
                console.error('Error cargando catálogo:', error);
                // Si no hay catálogo, agregar un item vacío
                renderizarCategorias();
                agregarItem();
            }
        }

        function agregarItemConDatos(item) {
            const itemsContainer = document.getElementById('items-container');
            const nuevoItem = document.createElement('div');
            nuevoItem.className = 'item-row item-row-edit';

            const categorias = item.tipo === 'servicio'
                ? categoriasPorTipo.servicio
                : (item.tipo === 'producto' ? categoriasPorTipo.producto : []);

            nuevoItem.innerHTML = `
                <div class="item-fila item-fila-principal">
                    <input class="item-id" type="text" placeholder="id-unico" value="${escapeHtml(item.id)}" required>
                    <select class="item-tipo" required>
                        <option value="">Seleccionar...</option>
                        <option value="producto" ${item.tipo === 'producto' ? 'selected' : ''}>Producto</option>
                        <option value="servicio" ${item.tipo === 'servicio' ? 'selected' : ''}>Servicio</option>
                    </select>
                    <input class="item-nombre" type="text" placeholder="Nombre del item" value="${escapeHtml(item.nombre)}" required>
                    <input class="item-precio" type="number" placeholder="Precio" step="0.01" value="${item.precio || 0}" required>
                    <button type="button" class="btn-remove-item" onclick="eliminarItem(this)">×</button>
                </div>
                <div class="item-fila">
                    <textarea class="item-desc" placeholder="Descripción (máx. 200 caracteres)" maxlength="200" required>${escapeHtml(item.descripcion)}</textarea>
                </div>
                <div class="item-fila item-fila-secundaria">
                    <select class="categoria-select item-categoria">
                        <option value="">Seleccionar categoría (opcional)</option>
                        ${categorias.map(cat => `<option value="${escapeHtml(cat)}" ${item.categoria === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`).join('')}
                    </select>
                    <label class="item-disponible"><input type="checkbox" ${item.disponible !== false ? 'checked' : ''}> Disponible</label>
                    <label class="item-destacado"><input type="checkbox" ${item.destacado ? 'checked' : ''}> Destacado</label>
                    <input class="item-duracion" type="number" placeholder="Minutos" value="${item.tipo === 'servicio' ? (item.duracion_minutos || 0) : ''}">
                    <input class="item-calendly" type="text" placeholder="URL de Calendly (opcional)" value="${escapeHtml(item.calendly_url)}">
                </div>
            `;

            itemsContainer.appendChild(nuevoItem);
        }

        function previsualizarCatalogo() {
            const previewSection = document.getElementById('preview-section');
            const previewContent = document.getElementById('preview-content');

            if (previewSection.style.display === 'none') {
                const catalogo = obtenerCatalogo();
                previewContent.textContent = JSON.stringify(catalogo, null, 2);
                previewSection.style.display = 'block';
            } else {
                previewSection.style.display = 'none';
            }
        }

        async function guardarCatalogo(event) {
            event.preventDefault();

            if (!(await window.admin.isAuthenticated())) {
                window.location.href = '/admin/index.html';
                return;
            }

            const catalogo = obtenerCatalogo();
            
            // Validar
            if (!catalogo.items || catalogo.items.length === 0) {
                mostrarError('Por favor, agrega al menos un item');
                return;
            }

            const btnSubmit = document.querySelector('#form-catalogo button[type="submit"]');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('mensaje-error');
            const successDiv = document.getElementById('mensaje-exito');

            btnSubmit.disabled = true;
            loading.style.display = 'block';
            errorDiv.classList.add('oculto');
            successDiv.classList.add('oculto');

            try {
                await window.admin.putContent('catalogo', catalogo);
                catalogoActual = catalogo;

                mostrarExito('Catálogo guardado exitosamente');
                actualizarPreviewItems();
            } catch (error) {
                console.error('Error guardando catálogo:', error);
                mostrarError(error.message || 'Error guardando el catálogo. Por favor, intente nuevamente.');
            } finally {
                btnSubmit.disabled = false;
                loading.style.display = 'none';
            }
        }

        function cerrarSesion() {
            window.admin.logout();
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('mensaje-error');
            errorDiv.textContent = mensaje;
            errorDiv.classList.remove('oculto');
            errorDiv.classList.add('error');

            const successDiv = document.getElementById('mensaje-exito');
            successDiv.classList.add('oculto');
        }

        function mostrarExito(mensaje) {
            const successDiv = document.getElementById('mensaje-exito');
            successDiv.textContent = mensaje;
            successDiv.classList.remove('oculto');
            successDiv.classList.add('success');

            const errorDiv = document.getElementById('mensaje-error');
            errorDiv.classList.add('oculto');
        }

        async function verificarAuth() {
            if (!(await window.admin.isAuthenticated())) {
                window.location.href = '/admin/index.html';
                return;
            }

            await cargarCatalogo();
        }

        document.addEventListener('DOMContentLoaded', function() {
            verificarAuth();

            document.getElementById('form-catalogo').addEventListener('submit', guardarCatalogo);

            // Actualizar preview cuando cambian los inputs
            document.getElementById('form-catalogo').addEventListener('input', function() {
                actualizarPreviewItems();
            });

            document.getElementById('items-container').addEventListener('change', function(event) {
                if (event.target.matches('.item-tipo')) {
                    actualizarOpcionesCategoria();
                }
            });

            document.querySelectorAll('.categoria-input').forEach(input => {
                input.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        agregarCategoria(input.dataset.tipo);
                    }
                });
            });
        });
    </script>
</body>
</html>
