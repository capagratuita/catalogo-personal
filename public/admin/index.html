<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Iniciar Sesión</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        .admin-login {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .admin-login h2 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 1.5rem;
        }

        .admin-login .form-group {
            margin-bottom: 1.5rem;
        }

        .admin-login label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #555;
        }

        .admin-login input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .admin-login input[type="password"]:focus {
            outline: none;
            border-color: #8B4513;
        }

        .admin-login .btn {
            width: 100%;
            padding: 0.8rem;
            background: #8B4513;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .admin-login .btn:hover {
            background: #6B3410;
        }

        .admin-login .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .admin-login .error {
            background: #ffebee;
            color: #d32f2f;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .admin-login .success {
            background: #e8f5e8;
            color: #388e3c;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .admin-login .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .admin-login .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #8B4513;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo">Panel de Administración</div>
        </div>
    </nav>

    <main>
        <section class="admin-login">
            <h2>Panel de Administración</h2>
            <div id="mensaje-error" class="oculto"></div>
            <div id="mensaje-exito" class="oculto"></div>

            <form id="form-login" onsubmit="iniciarSesion(event)">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="btn-login">Iniciar Sesión</button>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Verificando...</p>
                </div>
            </form>
        </section>
    </main>

    <script>
        async function iniciarSesion(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btn-login');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('mensaje-error');
            const successDiv = document.getElementById('mensaje-exito');
            
            if (!password) {
                mostrarError('Por favor, ingresa la contraseña');
                return;
            }
            
            btnLogin.disabled = true;
            loading.style.display = 'block';
            errorDiv.classList.add('oculto');
            successDiv.classList.add('oculto');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    mostrarExito('Inicio de sesión exitoso');
                    setTimeout(() => {
                        window.location.href = '/admin/identidad.html';
                    }, 1000);
                } else {
                    mostrarError(data.error || 'Contraseña incorrecta');
                }
            } catch (error) {
                console.error('Error en login:', error);
                mostrarError('Error en el servidor. Por favor, intenta nuevamente.');
            } finally {
                btnLogin.disabled = false;
                loading.style.display = 'none';
            }
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('mensaje-error');
            errorDiv.textContent = mensaje;
            errorDiv.classList.remove('oculto');
            errorDiv.classList.add('error');
            
            const successDiv = document.getElementById('mensaje-exito');
            successDiv.classList.add('oculto');
        }

        function mostrarExito(mensaje) {
            const successDiv = document.getElementById('mensaje-exito');
            successDiv.textContent = mensaje;
            successDiv.classList.remove('oculto');
            successDiv.classList.add('success');
            
            const errorDiv = document.getElementById('mensaje-error');
            errorDiv.classList.add('oculto');
        }
    </script>
</body>
</html>
