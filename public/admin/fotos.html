<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin - Fotos</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="stylesheet" href="../assets/admin.css">
    <style>

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .items-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .item-preview {
            background: white;
            border-radius: 5px;
            padding: 0.5rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .item-preview-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 0.5rem;
        }

        .item-preview-info h4 {
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .item-preview-info p {
            margin: 0;
            font-size: 0.8rem;
            color: #666;
        }

        .upload-zone {
            border: 2px dashed #ddd;
            border-radius: 5px;
            padding: 2rem;
            text-align: center;
            background: #f9f9f9;
            transition: all 0.3s;
            cursor: pointer;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: #f0f0f0;
        }

        .upload-zone input {
            display: none;
        }

        .upload-zone-label {
            cursor: pointer;
            display: block;
        }

        .upload-zone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .upload-zone-text {
            color: #666;
        }

        .upload-progress {
            margin-top: 1rem;
            padding: 1rem;
            background: #e3f2fd;
            border-radius: 5px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: #2196f3;
            border-radius: 10px;
            transition: width 0.3s;
        }

        .selected-item-info {
            margin-top: 1rem;
            padding: 1rem;
            background: #fff3e0;
            border-radius: 5px;
            display: none;
        }

        .selected-item-info h4 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo">Panel de Administración</div>
        </div>
    </nav>

    <main>
        <div class="admin-panel">
            <div class="admin-header">
                <h2>Fotos</h2>
                <button type="button" class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>

            <p class="ayuda">Sube una foto para cada servicio o producto. Se muestra en la tarjeta, en la ficha y al compartir el enlace.</p>

            <div id="mensaje-error" class="oculto" role="alert"></div>
            <div id="mensaje-exito" class="oculto" role="status"></div>

            <div class="form-group">
                <label for="item-select">Seleccionar Item</label>
                <select id="item-select" required>
                    <option value="">Seleccionar un item...</option>
                </select>
            </div>

            <div class="upload-zone" id="upload-zone">
                <label for="file-input" class="upload-zone-label">
                    <div class="upload-zone-icon">📷</div>
                    <div class="upload-zone-text">
                        <strong>Haz clic para subir una imagen</strong><br>
                        PNG, JPEG o WebP. Se convierte a JPEG ligero (máx. 1200 px) al subir
                    </div>
                </label>
                <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
            </div>

            <div class="upload-progress" id="upload-progress">
                <div>Subiendo imagen...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>

            <div class="selected-item-info" id="selected-item-info">
                <h4 id="selected-item-title">Item seleccionado</h4>
                <p id="selected-item-desc"></p>
                <img id="selected-item-preview" alt="Vista previa de la imagen seleccionada" style="display: none; max-width: 100%; max-height: 220px; border-radius: 5px; margin-top: 0.5rem;">
            </div>

            <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem;">
            <button class="btn" id="btn-upload" onclick="subirImagen()" disabled>Subir Imagen</button>
            <button class="btn btn-secondary" onclick="previsualizarImagenes()">Previsualizar Todas las Imágenes</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Subiendo...</p>
            </div>

            <div class="preview-section" id="preview-section" style="display: none;">
                <h3>Vista Previa de todas las Imágenes</h3>
                <div class="items-preview" id="items-preview">
                    <!-- Imágenes serán mostradas aquí -->
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/admin.js"></script>
    <script>
        let catalogo = null;
        let itemSeleccionado = null;
        let archivoImagen = null;
        let archivoPreviewUrl = null;

        async function cargarCatalogo() {
            try {
                const catalogoData = await window.admin.getContent('catalogo');
                // «Sobre mí» no es un item del catálogo: usa el id reservado de la landing
                catalogo = {
                    ...catalogoData,
                    items: [
                        { id: 'sobre-mi', nombre: 'Foto de «Sobre mí» (landing)', categoria: 'landing', precio: 0 },
                        ...((catalogoData && catalogoData.items) || [])
                    ]
                };
                actualizarSelectItems();
            } catch (error) {
                console.error('Error cargando catálogo:', error);
                mostrarError('Error cargando el catálogo. Por favor, intente nuevamente.');
            }
        }

        function actualizarSelectItems() {
            const select = document.getElementById('item-select');
            select.innerHTML = '<option value="">Seleccionar un item...</option>';

            if (!catalogo || !catalogo.items) return;

            catalogo.items.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.nombre;
                select.appendChild(option);
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                if (!file.type.startsWith('image/')) {
                    mostrarError('Por favor, selecciona un archivo de imagen válido');
                    return;
                }

                if (file.size > 25 * 1024 * 1024) {
                    mostrarError('El archivo es demasiado grande. Máximo 25MB');
                    return;
                }

                archivoImagen = file;
                actualizarVistaSeleccionado();
            }
        }

        function actualizarVistaSeleccionado() {
            const info = document.getElementById('selected-item-info');
            const title = document.getElementById('selected-item-title');
            const desc = document.getElementById('selected-item-desc');
            const preview = document.getElementById('selected-item-preview');

            if (itemSeleccionado) {
                title.textContent = itemSeleccionado.nombre;
                desc.textContent = itemSeleccionado.descripcion;
            } else {
                title.textContent = 'Ningún item seleccionado';
                desc.textContent = 'Selecciona un item del catálogo para asociar la imagen.';
            }

            if (archivoImagen) {
                if (archivoPreviewUrl) URL.revokeObjectURL(archivoPreviewUrl);
                archivoPreviewUrl = URL.createObjectURL(archivoImagen);
                preview.src = archivoPreviewUrl;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }

            info.style.display = 'block';
            document.getElementById('btn-upload').disabled = !(itemSeleccionado && archivoImagen);
        }

        function limpiarVistaSeleccionado() {
            itemSeleccionado = null;
            archivoImagen = null;
            if (archivoPreviewUrl) {
                URL.revokeObjectURL(archivoPreviewUrl);
                archivoPreviewUrl = null;
            }
            document.getElementById('selected-item-preview').style.display = 'none';
            document.getElementById('selected-item-info').style.display = 'none';
            document.getElementById('btn-upload').disabled = true;
            document.getElementById('file-input').value = '';
        }

        async function subirImagen() {
            if (!itemSeleccionado || !archivoImagen) {
                mostrarError('Por favor, selecciona un item y un archivo');
                return;
            }

            const btnUpload = document.getElementById('btn-upload');
            const loading = document.getElementById('loading');
            const progressFill = document.getElementById('progress-fill');

            btnUpload.disabled = true;
            loading.style.display = 'block';
            document.getElementById('upload-progress').style.display = 'block';

            try {
                const formData = new FormData();
                formData.append('id', itemSeleccionado.id);
                const optimizada = await window.admin.optimizarImagen(archivoImagen);
                formData.append('file', optimizada);

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Error subiendo imagen');
                }

                const data = await response.json();

                mostrarExito(`Imagen subida exitosamente (${Math.round(optimizada.size / 1024)} KB). URL: ${data.url}`);

                renderizarPrevisualizacion();
                document.getElementById('preview-section').style.display = 'block';

                setTimeout(() => {
                    limpiarVistaSeleccionado();
                    loading.style.display = 'none';
                    document.getElementById('upload-progress').style.display = 'none';
                }, 2000);

            } catch (error) {
                console.error('Error subiendo imagen:', error);
                mostrarError(error.message || 'Error subiendo la imagen. Por favor, intente nuevamente.');
            } finally {
                btnUpload.disabled = false;
                loading.style.display = 'none';
                document.getElementById('upload-progress').style.display = 'none';
                progressFill.style.width = '0%';
            }
        }

        function renderizarPrevisualizacion() {
            if (!catalogo || !catalogo.items) return;

            const previewContainer = document.getElementById('items-preview');
            let html = '';

            catalogo.items.forEach(item => {
                html += `
                    <div class="item-preview">
                        <img src="/api/image?id=${encodeURIComponent(item.id)}&v=${Date.now()}" alt="${item.nombre}" class="item-preview-img" onerror="this.src='/assets/images/placeholder.png'" />
                        <div class="item-preview-info">
                            <h4>${item.nombre}</h4>
                            <p>${item.categoria} - S/. ${item.precio}</p>
                        </div>
                    </div>
                `;
            });

            previewContainer.innerHTML = html;
        }

        function previsualizarImagenes() {
            if (!catalogo || !catalogo.items) return;

            renderizarPrevisualizacion();
            document.getElementById('preview-section').style.display = 'block';
        }

        function cerrarSesion() {
            window.admin.logout();
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('mensaje-error');
            errorDiv.textContent = mensaje;
            errorDiv.classList.remove('oculto');
            errorDiv.classList.add('error');

            const successDiv = document.getElementById('mensaje-exito');
            successDiv.classList.add('oculto');
        }

        function mostrarExito(mensaje) {
            const successDiv = document.getElementById('mensaje-exito');
            successDiv.textContent = mensaje;
            successDiv.classList.remove('oculto');
            successDiv.classList.add('success');

            const errorDiv = document.getElementById('mensaje-error');
            errorDiv.classList.add('oculto');
        }

        async function verificarAuth() {
            if (!(await window.admin.isAuthenticated())) {
                window.location.href = '/admin/index.html';
                return;
            }

            cargarCatalogo();
        }

        document.addEventListener('DOMContentLoaded', function() {
            verificarAuth();

            document.getElementById('item-select').addEventListener('change', function() {
                const itemId = this.value;
                if (itemId) {
                    itemSeleccionado = catalogo.items.find(item => item.id === itemId);
                    actualizarVistaSeleccionado();
                } else {
                    limpiarVistaSeleccionado();
                }
            });

            document.getElementById('file-input').addEventListener('change', handleFileSelect);
        });
    </script>
</body>
</html>
