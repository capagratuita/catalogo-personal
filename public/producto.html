<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <nav>
        <div class="container">
            <a class="logo" href="/"></a>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/#catalogo">Catálogo</a></li>
                <li><a href="/faq">Preguntas Frecuentes</a></li>
            </ul>
            <a class="carrito-icon" href="/carrito">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.7l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.2a1.6 1.6 0 0 0 1.6-1.2l1.4-6.8H6.1"/></svg>
                <span class="solo-lectores">Carrito:</span><span class="carrito-contador" id="carrito-contador">0</span>
            </a>
        </div>
    </nav>

    <main>
        <section class="producto-detalle">
            <div class="container">
                <div class="producto-detalle-contenido">
                    <div class="producto-imagen-container">
                        <img id="producto-imagen" src="/assets/images/placeholder.png" alt="Imagen del producto" class="producto-imagen">
                    </div>
                    <div class="producto-info">
                        <h2 id="producto-nombre">Cargando...</h2>
                        <div class="producto-meta">
                            <span id="producto-tipo" class="producto-tipo"></span>
                            <span id="producto-categoria" class="producto-categoria"></span>
                        </div>
                        <div class="producto-precio" id="producto-precio">S/. 0.00</div>
                        <div class="producto-descripcion" id="producto-descripcion">Cargando descripción...</div>
                        <div class="producto-servicio-info" id="producto-servicio-info" style="display: none;">
                            <span id="producto-duracion">0 minutos</span>
                        </div>
                        <div class="producto-servicio-detalle" id="producto-servicio-detalle" hidden></div>
                        <div id="producto-calendly" class="producto-calendly" style="display: none;">
                            <!-- Aquí va el botón de reservar o consultar -->
                        </div>
                        <div class="producto-actions">
                            <button class="btn btn-primary" id="btn-agregar" onclick="agregarAlCarritoDesdePagina()">Añadir al Carrito</button>
                            <button class="btn btn-secondary" id="btn-seguir" onclick="window.location.href='/#catalogo'">Seguir Comprando</button>
                        </div>
                        <p class="producto-compartir" id="producto-compartir" hidden>
                            Compartir:
                            <a id="compartir-whatsapp" href="#" target="_blank" rel="noopener">WhatsApp</a>
                            <span aria-hidden="true">·</span>
                            <button type="button" id="compartir-copiar">Copiar enlace</button>
                            <span class="compartir-estado" id="compartir-estado" role="status"></span>
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div>
                <h3></h3>
                <p></p>
            </div>
            <ul class="footer-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/#catalogo">Catálogo</a></li>
                <li><a href="/faq">Preguntas Frecuentes</a></li>
                <li><a href="/carrito">Carrito</a></li>
            </ul>
            <div class="redes-sociales">
                <a data-red="instagram" href="#" target="_blank" rel="noopener" hidden>Instagram</a>
                <a data-red="facebook" href="#" target="_blank" rel="noopener" hidden>Facebook</a>
                <a data-red="whatsapp" href="#" target="_blank" rel="noopener" hidden>WhatsApp</a>
            </div>
        </div>
    </footer>

    <script src="/assets/app.js"></script>
    <script>
        let productoActual = null;
        let configActual = null;
        let carrito = [];

        async function cargarProducto() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            if (!productId) {
                window.location.href = '/#catalogo';
                return;
            }
            
            try {
                // Cargar datos necesarios
                const [catalogo, config, landing] = await Promise.all([
                    window.app.loadCatalogo(),
                    window.app.loadConfig(),
                    window.app.loadLanding()
                ]);

                // Encontrar el producto
                const producto = catalogo.items.find(item => item.id === productId);
                if (!producto) {
                    mostrarError('Producto no encontrado');
                    return;
                }

                productoActual = producto;
                configActual = config;
                renderizarProducto(producto, config, catalogo);
                actualizarContadorCarrito();
                cargarImagenProducto(producto.id);

            } catch (error) {
                console.error('Error cargando producto:', error);
                mostrarError('Error cargando producto. Por favor, intente nuevamente.');
            }
        }

        function renderizarProducto(producto, config, catalogo) {
            prepararCompartir(producto, config);
            document.getElementById('producto-nombre').textContent = producto.nombre;
            document.getElementById('producto-precio').textContent = window.app.textoPrecio(producto, config.perfil.moneda);
            document.getElementById('producto-descripcion').textContent = producto.descripcion;
            
            // Categoria y tipo
            const categoriaSpan = document.getElementById('producto-categoria');
            const tipoSpan = document.getElementById('producto-tipo');
            const categoria = (producto.categoria || '').trim();
            categoriaSpan.textContent = categoria ? categoria.charAt(0).toUpperCase() + categoria.slice(1) : '';
            tipoSpan.textContent = producto.tipo === 'producto' ? 'Producto' : 'Servicio';
            
            // Mostrar información de servicio si es un servicio
            const servicioInfo = document.getElementById('producto-servicio-info');
            const duracionSpan = document.getElementById('producto-duracion');
            if (producto.tipo === 'servicio' && producto.duracion_minutos > 0) {
                servicioInfo.style.display = 'flex';
                duracionSpan.textContent = `${producto.duracion_minutos} minutos`;
            } else {
                servicioInfo.style.display = 'none';
            }
            renderizarDetalleServicio(producto, config);
            
            // Una sola acción: carrito (productos), cotizar/reservar/consultar (servicios)
            const accion = window.app.accionItem(producto, config, catalogo);
            const calendlyContainer = document.getElementById('producto-calendly');
            const agregarBtn = document.getElementById('btn-agregar');
            const seguirBtn = document.getElementById('btn-seguir');

            const esCarrito = Boolean(accion) && accion.tipo === 'carrito';
            agregarBtn.hidden = !esCarrito;
            seguirBtn.textContent = esCarrito ? 'Seguir Comprando' : 'Volver al Catálogo';

            if (accion && accion.url) {
                const enlace = document.createElement('a');
                enlace.className = 'btn btn-primary';
                enlace.target = '_blank';
                enlace.rel = 'noopener';
                enlace.href = accion.url;
                enlace.textContent = accion.tipo === 'reservar' ? 'Reservar Cita' : 'Consultar por WhatsApp';
                calendlyContainer.replaceChildren(enlace);
                calendlyContainer.style.display = 'block';
            } else {
                calendlyContainer.replaceChildren();
                calendlyContainer.style.display = 'none';
            }
        }

        const MODALIDADES = { online: 'Online', presencial: 'Presencial', ambas: 'Online o presencial' };

        function crearElemento(etiqueta, clase, texto) {
            const el = document.createElement(etiqueta);
            if (clase) el.className = clase;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        // Modalidad, zona, qué incluye y opciones de precio (solo servicios; todo es opcional)
        function renderizarDetalleServicio(producto, config) {
            const contenedor = document.getElementById('producto-servicio-detalle');
            contenedor.replaceChildren();
            if (producto.tipo !== 'servicio') { contenedor.hidden = true; return; }

            const datos = [];
            if (MODALIDADES[producto.modalidad]) datos.push(MODALIDADES[producto.modalidad]);
            if (producto.zona) datos.push(producto.zona);
            if (datos.length) contenedor.appendChild(crearElemento('p', 'servicio-modalidad', datos.join(' · ')));

            const incluye = Array.isArray(producto.incluye) ? producto.incluye : [];
            if (incluye.length) {
                contenedor.appendChild(crearElemento('h3', null, 'Qué incluye'));
                const lista = crearElemento('ul', 'servicio-incluye');
                incluye.forEach(linea => lista.appendChild(crearElemento('li', null, linea)));
                contenedor.appendChild(lista);
            }

            const variantes = window.app.variantesDe(producto);
            if (variantes.length) {
                contenedor.appendChild(crearElemento('h3', null, 'Opciones'));
                const lista = crearElemento('ul', 'servicio-variantes');
                variantes.forEach(v => {
                    const li = crearElemento('li');
                    li.appendChild(crearElemento('span', 'variante-nombre', v.nombre));
                    const duracion = v.duracion_minutos > 0 ? ` · ${v.duracion_minutos} min` : '';
                    li.appendChild(crearElemento('span', 'variante-precio', window.app.formatPrecio(v.precio, config.perfil.moneda) + duracion));
                    lista.appendChild(li);
                });
                contenedor.appendChild(lista);
            }

            contenedor.hidden = contenedor.childElementCount === 0;
        }

        // Compartir sin protagonismo: enlace a WhatsApp con el mensaje escrito y copiar el enlace
        function prepararCompartir(producto, config) {
            const url = `${location.origin}/producto?id=${encodeURIComponent(producto.id)}`;
            const mensaje = `${producto.nombre} en ${config.perfil.nombre}: ${url}`;

            document.getElementById('compartir-whatsapp').href = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;

            // El resultado se muestra en el propio texto del enlace (sin mover el diseño)
            // y se anuncia a lectores de pantalla en un aviso oculto.
            const copiar = document.getElementById('compartir-copiar');
            const estado = document.getElementById('compartir-estado');
            copiar.onclick = async () => {
                let resultado;
                try {
                    await navigator.clipboard.writeText(url);
                    resultado = 'Enlace copiado';
                } catch {
                    resultado = 'No se pudo copiar';
                }
                copiar.textContent = resultado;
                estado.textContent = resultado;
                setTimeout(() => {
                    copiar.textContent = 'Copiar enlace';
                    estado.textContent = '';
                }, 2500);
            };

            document.getElementById('producto-compartir').hidden = false;
        }

        function cargarImagenProducto(productId) {
            const imagen = document.getElementById('producto-imagen');
            imagen.onerror = () => {
                imagen.src = '/assets/images/placeholder.png';
            };
            imagen.src = `/api/image?id=${encodeURIComponent(productId)}&v=${Date.now()}`;
        }

        function agregarAlCarritoDesdePagina() {
            if (productoActual) {
                const moneda = configActual?.perfil?.moneda || 'PEN';
                window.app.addToCarrito(productoActual.id, productoActual.nombre, productoActual.precio, moneda);
                actualizarContadorCarrito();
                mostrarNotificacion('Producto agregado al carrito');
            }
        }

        function actualizarContadorCarrito() {
            const total = window.app.getCarrito().reduce((acc, item) => acc + item.cantidad, 0);
            document.getElementById('carrito-contador').textContent = total;
        }

        function mostrarError(mensaje) {
            const contenedor = document.querySelector('.producto-detalle-contenido');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = mensaje;
            contenedor.prepend(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        function mostrarNotificacion(mensaje) {
            const notificacion = document.createElement('div');
            notificacion.className = 'notificacion';
            notificacion.textContent = mensaje;
            notificacion.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #4CAF50;
                color: white;
                padding: 1rem 2rem;
                border-radius: 5px;
                z-index: 1000;
                animation: slideUp 0.3s ease;
            `;
            document.body.appendChild(notificacion);

            setTimeout(() => {
                notificacion.remove();
            }, 3000);
        }

        // Cargar datos cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            cargarProducto();
        });
    </script>
</body>
</html>
