# Trae al repositorio las mejoras del template original. Solo se ejecuta a mano:
# Actions → «Sincronizar con el template» → Run workflow.
# Abre un pull request con los cambios; al fusionarlo, Cloudflare vuelve a desplegar.
# No toca wrangler.toml (guarda tu configuración) ni .github/ (GITHUB_TOKEN no puede modificar workflows).
name: Sincronizar con el template

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: capagratuita/catalogo-personal
  RAMA: sincronizar-template

jobs:
  sincronizar:
    # En el repositorio original no hay nada que sincronizar
    if: github.repository != 'capagratuita/catalogo-personal'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar tu repositorio
        uses: actions/checkout@v4

      - name: Descargar el template
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          path: _template

      - name: Copiar los archivos del template
        run: |
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='_template/' \
            --exclude='node_modules/' --exclude='.wrangler/' --exclude='.dev.vars' \
            --exclude='wrangler.toml' \
            _template/ ./

      - name: Avisar si wrangler.toml del template cambió
        run: |
          # Se comparan sin las líneas «id = …», que son los namespaces KV de cada persona
          if ! diff -q <(grep -v '^id = ' wrangler.toml) <(grep -v '^id = ' _template/wrangler.toml) >/dev/null; then
            echo "wrangler.toml del template cambió. Revisa las diferencias y aplícalas a mano conservando tus id de KV." > _aviso.txt
          fi

      - name: Crear o actualizar el pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _template
          AVISO=""
          if [ -f _aviso.txt ]; then AVISO="$(cat _aviso.txt)"; rm _aviso.txt; fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "Ya estás al día con el template."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RAMA"
          git add -A
          git commit -m "Sincroniza con el template ($UPSTREAM)"
          git push --force origin "$RAMA"

          CUERPO="Mejoras traídas de https://github.com/$UPSTREAM. Revisa los cambios y fusiona: Cloudflare volverá a desplegar. Tu contenido (catálogo, textos, fotos) está en KV y no se toca. ${AVISO}"
          if [ -z "$(gh pr list --head "$RAMA" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$RAMA" --title "Sincronizar con el template" --body "$CUERPO" \
              || echo "No se pudo crear el pull request solo. Ábrelo desde la pestaña Pull requests (rama $RAMA) o activa Settings → Actions → General → «Allow GitHub Actions to create and approve pull requests»."
          fi
