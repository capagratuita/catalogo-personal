name = "catalogo-personal"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# URL pública *.workers.dev. Sin URLs de vista previa: compartirían KV y contraseña con producción.
workers_dev = true
preview_urls = false

# Archivos estáticos (public/). `run_worker_first` lista las rutas que pasan por el Worker
# (páginas con SEO, API y admin protegido); el resto se sirve directo, sin gastar invocaciones.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = [
  "/",
  "/faq",
  "/carrito",
  "/producto",
  "/producto/*",
  "/servicio/*",
  "/sitemap.xml",
  "/robots.txt",
  "/api/*",
  "/admin",
  "/admin/*",
]

# Workers KV: contenido (config, catalogo, landing, faq). Sin `id`: el botón
# «Deploy to Cloudflare» (y `wrangler deploy`) crean el namespace automáticamente.
[[kv_namespaces]]
binding = "KV"

# Workers KV (segundo namespace): fotos de los items como binarios (claves items/{id}.{ext}).
# Se usa KV en lugar de R2 porque no pide método de pago.
[[kv_namespaces]]
binding = "IMAGES"
