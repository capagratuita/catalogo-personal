name = "personal-ecommerce"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# Workers KV: almacena los JSONs (config, catalogo, landing, faq)
# En local, Wrangler usa un KV local automáticamente.
# En producción, reemplaza "placeholder" con el ID real del namespace
# (Dashboard → Workers & Pages → KV → tu namespace → ID).
[[kv_namespaces]]
binding = "KV"
id = "0b5c9d9f26ee42b6ab7d9473ee446132"

# Workers KV (segundo namespace): almacena las fotos de los items como binarios
# (claves items/{id}.{ext}). Se usa KV en lugar de R2 porque no pide método de pago.
# En local, Wrangler usa un KV local automáticamente.
# En producción, reemplaza el id con el del namespace real de fotos.
[[kv_namespaces]]
binding = "IMAGES"
id = "b2a6c12a3d6e4d2da5175b971ea40ead"

# Workers AI: usado por /api/chat.
# Descomenta este bloque para habilitar el chat en local o producción.
# En local requiere `npx wrangler login`; sin el binding, /api/chat devuelve 503.
# [ai]
# binding = "AI"
